{{- /*
Credentials are never stored in Git. On first install each missing value is generated at random.
On upgrade the values already stored in the cluster are reused through lookup, so passwords stay stable.
The keep policy stops "helm uninstall" from deleting the Secret: the database volume survives an uninstall
and was initialised with these passwords, so a new random Secret would lock the chart out of its own data.
Note: lookup returns nothing under "helm template" and client-side dry runs, so rendered output there is random.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "store.secretName" .) -}}
{{- $old := dict -}}
{{- if $existing -}}
{{- $old = $existing.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.secretName" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "store.secretValue" (dict "override" .Values.secrets.mariadbRootPassword "old" $old "key" "mariadb-root-password") }}
  mariadb-password: {{ include "store.secretValue" (dict "override" .Values.secrets.mariadbPassword "old" $old "key" "mariadb-password") }}
  wordpress-admin-password: {{ include "store.secretValue" (dict "override" .Values.secrets.wordpressAdminPassword "old" $old "key" "wordpress-admin-password") }}
