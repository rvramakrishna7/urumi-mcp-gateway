{{- /*
WooCommerce REST API key for the woo-mcp server. The bootstrap Job installs it into WooCommerce for the
dedicated "woo-mcp" user, so the Secret is the source of truth and no click in wp-admin is needed.
Same rules as secret.yaml: generated at random on first install, reused through lookup on upgrade, and kept on
"helm uninstall". Under "helm template" lookup returns nothing, so rendered values there are random.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "store.wooMcpSecretName" .) -}}
{{- $old := dict -}}
{{- if $existing -}}
{{- $old = $existing.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.wooMcpSecretName" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp-api
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  consumer-key: {{ include "store.wooMcpApiValue" (dict "old" $old "key" "consumer-key" "prefix" "ck_") }}
  consumer-secret: {{ include "store.wooMcpApiValue" (dict "old" $old "key" "consumer-secret" "prefix" "cs_") }}
