{{- /*
Only the storefront is public. MariaDB has no Ingress.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  ingressClassName: {{ .Values.wordpress.ingress.className }}
  rules:
    - host: {{ required "store.host is required" .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  name: http
