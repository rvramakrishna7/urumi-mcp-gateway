{{- /*
"mariadb" is the Service other pods use. "mariadb-headless" is the governing Service of the StatefulSet.
Neither has an Ingress, so the database is reachable only from inside the cluster.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  selector:
    {{- include "store.selectorLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-headless
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  clusterIP: None
  selector:
    {{- include "store.selectorLabels" (dict "root" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
