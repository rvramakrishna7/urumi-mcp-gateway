# Overrides for a production-like k3s VPS.
# Use with: helm upgrade --install store charts/store -n store --create-namespace -f charts/store/values-prod.yaml
#
# The sizes and the resource numbers are untested starting points.
# Credentials are not set here. The chart generates them inside the cluster on first install
# (see templates/secret.yaml). To supply your own, pass them at install time with --set-file, never in this file.

store:
  # The DNS A record of this name points at the VPS.
  host: store.urumi-rk.duckdns.org
  # https goes together with wordpress.ingress.tls below.
  scheme: https
  admin:
    # Login identifier only. The gateway and WordPress send no mail, so this address needs no mailbox.
    email: admin@urumi-rk.duckdns.org

mariadb:
  persistence:
    size: 10Gi
    # Empty means the cluster default StorageClass, which is local-path on k3s.
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

wordpress:
  ingress:
    # cert-manager reads the annotation, gets a certificate for store.host and keeps it in the Secret below.
    # Staging certificates are not trusted by browsers: switch to letsencrypt-prod after a staging run works.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
      # Serve the app on HTTPS only. Plain HTTP on port 80 gets a 404, so an API key, a password or a session can never
      # cross the internet unencrypted. cert-manager's HTTP-01 challenge uses its own temporary Ingress, which is not
      # restricted, so certificate issuance and renewal still work on port 80.
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    tls:
      enabled: true
      secretName: store-tls
  persistence:
    size: 10Gi
    storageClass: ""
  # The public hostname resolves through real DNS on the VPS, so no hosts-file workaround is needed.
  loopbackHostAlias: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
