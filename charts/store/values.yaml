# Default values for the store chart.
# Environment-specific settings belong in values-local.yaml and values-prod.yaml.
# This file must never contain real credentials.

store:
  # Public address of the storefront. Set per environment in values-local.yaml and values-prod.yaml.
  host: ""
  scheme: http
  title: Urumi Store
  currency: INR
  # IANA timezone name. It decides what "today" means for orders and scheduled actions.
  timezone: Asia/Kolkata
  # WooCommerce format: country code, optionally followed by a colon and the state code.
  country: "IN:MH"
  admin:
    username: storeadmin
    # Required. Set per environment. The admin password lives in the Secret, never in values.
    email: ""

woocommerce:
  # Pinned so every environment gets the same version. Changing it upgrades or downgrades on the next helm upgrade.
  version: "11.2.0"

wooMcp:
  # Dedicated WordPress user for the woo-mcp server. Its role, the key description and the key permissions are
  # fixed in files/bootstrap.sh and files/woo-mcp-key.php (docs/architecture.md, decision 15).
  username: woo-mcp

bootstrap:
  image:
    repository: wordpress
    tag: "cli-2.12.0-php8.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

secrets:
  # Optional explicit overrides. Leave empty so the chart generates a random value
  # on first install and keeps it across upgrades (see templates/secret.yaml).
  mariadbRootPassword: ""
  mariadbPassword: ""
  wordpressAdminPassword: ""

mariadb:
  image:
    repository: mariadb
    tag: "11.4.13"
    pullPolicy: IfNotPresent
  database: wordpress
  user: wordpress
  persistence:
    size: 1Gi
    # Empty means the cluster default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

wordpress:
  image:
    repository: wordpress
    tag: "7.1.3-php8.3-apache"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    # Empty means the cluster default StorageClass.
    storageClass: ""
  # Map the public hostname to 127.0.0.1 inside the WordPress pod. Pods cannot resolve a hosts-file
  # hostname, so without this WordPress cannot call its own public URL (WP-Cron, loopback requests).
  # Enable it only where the public hostname does not resolve inside the cluster (local k3d).
  loopbackHostAlias: false
  ingress:
    className: traefik
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
