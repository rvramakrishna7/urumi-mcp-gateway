# Overrides for a production-like k3s VPS.
# Use with: helm upgrade --install gateway charts/gateway -n gateway --create-namespace -f charts/gateway/values-prod.yaml
#
# This file is only rendered, not deployed (the production-like deployment is Step 20). The registry and the numbers
# are placeholders and untested starting points.
# Credentials are not set here: the database password is generated in the cluster on first install.

gateway:
  image:
    # The image comes from a registry that the VPS can reach, not from "k3d image import".
    repository: registry.example.com/urumi/gateway
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  # The Secret must exist in the namespace gateway before the install. Create it with your own credentials
  # (never put them in this file or in Git):
  #   kubectl create namespace gateway
  #   kubectl create secret docker-registry registry-credentials -n gateway \
  #     --docker-server=registry.example.com --docker-username=<user> --docker-password=<token>
  imagePullSecrets:
    - registry-credentials
  dbPoolMax: 20
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 512Mi

# The dashboard image also comes from the registry.
dashboard:
  image:
    repository: registry.example.com/urumi/dashboard
    tag: "0.7.0"

# A real DNS record for this host must point at the VPS (decision 8). It is a placeholder here.
ingress:
  host: gateway.example.com
  scheme: https

# A placeholder: use the real address of the first admin.
bootstrap:
  adminEmail: admin@example.com

postgres:
  persistence:
    size: 10Gi
    # Empty means the cluster default StorageClass, which is local-path on k3s.
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
