# Default values for the gateway chart.
# Environment-specific settings belong in values-local.yaml and values-prod.yaml.
# This file must never contain real credentials.

gateway:
  image:
    repository: gateway
    # Pinned to an exact version. Never use latest.
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  # Names of Secrets (of type kubernetes.io/dockerconfigjson) that hold registry credentials. Empty for the
  # local cluster, where the image is imported with "k3d image import".
  imagePullSecrets: []
  port: 8080
  # Connections that one gateway pod may open to PostgreSQL.
  dbPoolMax: 10
  # The id of the master key that encrypts new credentials (decision 30). Rotation adds a new id.
  masterKeyId: k1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # The migration runner, in the initContainer of the gateway pod.
  migrateResources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# The public endpoint (decision 32). The host has no default: it is set in values-local.yaml and values-prod.yaml.
# Only /mcp, /healthz and /api/admin are routed. The same host is the Host header that /mcp accepts.
ingress:
  enabled: true
  className: traefik
  # http or https. It is the scheme of PUBLIC_ORIGIN: https makes the session cookie Secure. Set https only together with TLS.
  scheme: http
  host: ""

# The first admin (decision 36). The gateway creates this user as an invited admin, with a random token from the Secret
# "gateway-bootstrap". Whoever reads the token chooses the password. Empty means no bootstrap and no Secret.
bootstrap:
  adminEmail: ""

# Servers that the install registers once (decision 31). The values hold no secret: a credential names the Secret that
# holds the value, and the chart copies it with lookup.
seed:
  # The install stops with a clear message when a source Secret is missing. Set this to false only to render the chart
  # without a cluster ("helm template", "helm lint"): the copied value is then a placeholder that does not work.
  requireExisting: true
  servers:
    - slug: woo
      name: WooCommerce
      # woo-mcp, inside the cluster. It is not reachable from outside (decision 7).
      url: http://woo-mcp.mcp-servers.svc.cluster.local:8080/mcp
      callTimeoutMs: 30000
      credential:
        kind: bearer
        source:
          namespace: mcp-servers
          secret: woo-mcp-auth
          key: token

postgres:
  image:
    repository: postgres
    # Pinned to an exact version of PostgreSQL and of Alpine. Never use latest.
    tag: "17.9-alpine3.23"
    pullPolicy: IfNotPresent
  database: gateway
  user: gateway
  persistence:
    size: 1Gi
    # Empty means the cluster default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
