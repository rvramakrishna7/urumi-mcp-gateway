{{- /*
The invite token of the first admin (docs/architecture.md, decision 36). It is random, it is the only thing here, and it
holds no password: the person who reads it from the Secret chooses the password when they accept the invite, and the
token is useless after that. On first install it is generated; on upgrade the value in the cluster is reused through
lookup, so the token stays the same. The keep policy stops "helm uninstall" from deleting it, like the other Secrets of
this chart. The token has the form inv_ and 43 letters or digits (about 256 bits). Under "helm template" lookup returns
nothing, so a rendered value there is random.
Created only when bootstrap.adminEmail is set.
*/ -}}
{{- if .Values.bootstrap.adminEmail }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "gateway.bootstrapSecretName" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.bootstrapSecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "inviteToken") }}
  inviteToken: {{ index $existing.data "inviteToken" }}
  {{- else }}
  inviteToken: {{ printf "inv_%s" (randAlphaNum 43) | b64enc }}
  {{- end }}
{{- end }}
