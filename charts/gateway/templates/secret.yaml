{{- /*
The password of the database user. It is never stored in Git. On first install it is generated at random. On upgrade
the value already stored in the cluster is reused through lookup, so the password stays stable. The keep policy stops
"helm uninstall" from deleting the Secret: the database volume survives an uninstall and was initialised with this
password, so a new random Secret would lock the chart out of its own data.
Note: lookup returns nothing under "helm template" and client-side dry runs, so a rendered value there is random.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "gateway.dbSecretName" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.dbSecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
