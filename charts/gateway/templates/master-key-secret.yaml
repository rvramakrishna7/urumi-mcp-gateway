{{- /*
The master key for the encryption of upstream credentials (docs/architecture.md, decision 30): 32 random bytes,
stored as their base64 text. randBytes gives 32 bytes from a cryptographic random source, so the key is uniformly
random (randAlphaNum would not be: its alphabet has only 62 symbols). On first install it is generated. On upgrade
the value in the cluster is reused through lookup. The keep policy stops "helm uninstall" from deleting it: the
database volume survives an uninstall, and without this key the credentials in it could not be read again.
Under "helm template" lookup returns nothing, so a rendered value there is random.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "gateway.masterKeySecretName" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.masterKeySecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "key") }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  # The file content is the base64 text of the 32 bytes; the Secret field is that text base64 encoded once more.
  key: {{ randBytes 32 | b64enc }}
  {{- end }}
