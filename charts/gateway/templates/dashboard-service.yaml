{{- /*
ClusterIP only. The public path is the Ingress (gateway-ingress.yaml), which sends every path that is not an API path here.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
