{{- /*
The install-time seed of the registry (docs/architecture.md, decision 31).

gateway-seed: the list of servers, without any secret. It names a file for each credential.
gateway-seed-credentials: the credential values, copied with lookup from the Secret that each entry names (for woo-mcp:
woo-mcp-auth in the namespace mcp-servers). The same value is copied on every upgrade, so a second "helm upgrade" changes
nothing, and a token rotation in mcp-servers arrives at the next upgrade. The gateway encrypts the value before it stores
it. This Secret belongs to the release and is removed with it.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.seedConfigName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  seed.json: {{ include "gateway.seedJson" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.seedSecretName" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
data:
  {{- range .Values.seed.servers }}
  {{- if .credential }}
  {{ .slug }}: {{ include "gateway.seedCredentialValue" (dict "root" $ "entry" .) }}
  {{- end }}
  {{- end }}
