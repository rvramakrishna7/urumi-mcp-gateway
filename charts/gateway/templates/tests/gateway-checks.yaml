{{- /*
"helm test" runs files/checks.mjs in a short-lived Pod with the gateway image, inside the namespace of the release.
The script prints names, counts and PASS or FAIL, never the password or a row. The Pod has no probes: like the Jobs
of the store chart it is a run-to-completion workload, bounded by activeDeadlineSeconds and resource limits.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-checks
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  checks.mjs: |
    {{- .Files.Get "files/checks.mjs" | nindent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: gateway-checks
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "0"
    # The previous test Pod is replaced on the next run, so its logs stay available until then.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  {{- include "gateway.imagePullSecrets" . | nindent 2 }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: checks
      image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
      imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
      command: ["node", "/scripts/checks.mjs"]
      env:
        {{- include "gateway.dbEnv" . | nindent 8 }}
        # The full Service name, as other callers will use it.
        - name: GATEWAY_URL
          value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.port }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: db-password
          mountPath: /secrets/db
          readOnly: true
  volumes:
    - name: scripts
      configMap:
        name: gateway-checks
    {{- include "gateway.dbSecretVolume" . | nindent 4 }}
