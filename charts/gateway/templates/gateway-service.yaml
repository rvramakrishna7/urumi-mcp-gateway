{{- /*
ClusterIP only. The public path is the Ingress (gateway-ingress.yaml); the dashboard comes in a later step.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
