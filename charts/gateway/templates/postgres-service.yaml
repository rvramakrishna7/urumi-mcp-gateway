{{- /*
"postgres" is the Service that the gateway uses. "postgres-headless" is the governing Service of the StatefulSet.
Neither has an Ingress, so the database is reachable only from inside the cluster. A NetworkPolicy that limits the
callers to the gateway Pods is added in the security step.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "gateway.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
