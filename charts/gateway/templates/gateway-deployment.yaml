{{- /* A digest of the seed and of its credentials restarts the pod when either changes, because the seed is applied at start. A digest cannot be turned back into the value. */ -}}
{{- $seedValues := list -}}
{{- range .Values.seed.servers -}}
{{- if .credential -}}
{{- $seedValues = append $seedValues (include "gateway.seedCredentialValue" (dict "root" $ "entry" .)) -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/seed: {{ cat (include "gateway.seedJson" .) (join "," $seedValues) | sha256sum }}
        {{- if .Values.bootstrap.adminEmail }}
        # The first admin is applied at start, so a changed e-mail restarts the pod. The token is not in this digest: it never changes.
        checksum/bootstrap: {{ .Values.bootstrap.adminEmail | sha256sum }}
        {{- end }}
    spec:
      # The gateway never talks to the Kubernetes API, so it gets no ServiceAccount token.
      automountServiceAccountToken: false
      {{- include "gateway.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Lets the group of the process read the mounted Secret file (mode 0440).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Covers the preStop sleep, then the 10 second shutdown timer of the app (src/index.ts), with a margin.
      terminationGracePeriodSeconds: {{ add (int .Values.gateway.preStopSleepSeconds) 25 }}
      # The migrations run before the server starts, from the same image, so the schema that the code expects is
      # there. A runner takes a database lock, so several pods starting together are safe. If the database is not
      # up yet, the runner retries for about two minutes and then fails, and Kubernetes restarts the pod.
      initContainers:
        - name: migrate
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          env:
            {{- include "gateway.dbEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: db-password
              mountPath: /secrets/db
              readOnly: true
          resources:
            {{- toYaml .Values.gateway.migrateResources | nindent 12 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- if gt (int .Values.gateway.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.gateway.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          # Only paths and settings here. The database password is read from the mounted file.
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: DB_POOL_MAX
              value: {{ .Values.gateway.dbPoolMax | quote }}
            - name: MASTER_KEY_FILE
              value: /secrets/master/key
            - name: MASTER_KEY_ID
              value: {{ .Values.gateway.masterKeyId | quote }}
            - name: SEED_FILE
              value: /config/seed/seed.json
            # The Host names that /mcp answers to (DNS rebinding protection). The health routes ignore it.
            - name: ALLOWED_HOSTS
              value: {{ required "ingress.host is required" .Values.ingress.host | quote }}
            {{- if .Values.bootstrap.adminEmail }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: BOOTSTRAP_TOKEN_FILE
              value: /secrets/bootstrap/inviteToken
            {{- end }}
            # The origin of the dashboard: the only Origin that login and session requests accept. Its scheme decides whether
            # the session cookie is Secure.
            - name: PUBLIC_ORIGIN
              value: {{ printf "%s://%s" (required "ingress.scheme is required" .Values.ingress.scheme) .Values.ingress.host | quote }}
            # The chat agent (decision 40). The Groq key is a file from the optional Secret gateway-groq; without it the chat
            # endpoint answers 503 and the rest of the gateway is unchanged. The file is read at start, so a new key needs a restart.
            - name: GROQ_API_KEY_FILE
              value: /secrets/groq/key
            - name: CHAT_MODEL
              value: {{ .Values.chat.model | quote }}
            - name: CHAT_CONFIRM_TOOLS
              value: {{ required "chat.confirmTools must name at least one tool" (join "," .Values.chat.confirmTools) | quote }}
            - name: CHAT_RATE_PER_MINUTE
              value: {{ .Values.chat.ratePerMinute | quote }}
            # Tool names that only an admin may list or call (tool permissions).
            - name: MEMBER_RESTRICTED_TOOLS
              value: {{ required "security.memberRestrictedTools must name at least one tool" (join "," .Values.security.memberRestrictedTools) | quote }}
            # The upstream addresses an admin may register (SSRF guard), and the namespace of this pod, whose names are never allowed.
            - name: UPSTREAM_ALLOWED_HOSTS
              value: {{ required "security.upstreamAllowedHosts must name at least one host:port" (join "," .Values.security.upstreamAllowedHosts) | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- include "gateway.dbEnv" . | nindent 12 }}
          # Liveness never calls the database or an upstream. Readiness calls the database (the gateway cannot
          # serve without it) and never an upstream: a slow or dead upstream must not take the gateway out of the
          # Service. The health routes need no token and ignore the Host header.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: db-password
              mountPath: /secrets/db
              readOnly: true
            - name: master-key
              mountPath: /secrets/master
              readOnly: true
            - name: seed-credentials
              mountPath: /secrets/seed
              readOnly: true
            {{- if .Values.bootstrap.adminEmail }}
            - name: bootstrap-token
              mountPath: /secrets/bootstrap
              readOnly: true
            {{- end }}
            - name: groq-key
              mountPath: /secrets/groq
              readOnly: true
            - name: seed-config
              mountPath: /config/seed
              readOnly: true
      volumes:
        {{- include "gateway.dbSecretVolume" . | nindent 8 }}
        - name: master-key
          secret:
            secretName: {{ include "gateway.masterKeySecretName" . }}
            defaultMode: 0440
            items:
              - key: key
                path: key
        - name: seed-credentials
          secret:
            secretName: {{ include "gateway.seedSecretName" . }}
            defaultMode: 0440
        {{- if .Values.bootstrap.adminEmail }}
        - name: bootstrap-token
          secret:
            secretName: {{ include "gateway.bootstrapSecretName" . }}
            defaultMode: 0440
            items:
              - key: inviteToken
                path: inviteToken
        {{- end }}
        # Created by hand, never by this chart (the key must not pass through Helm values or the release metadata).
        # optional: the pod starts without it and chat is then off.
        - name: groq-key
          secret:
            secretName: gateway-groq
            optional: true
            defaultMode: 0440
            items:
              - key: key
                path: key
        - name: seed-config
          configMap:
            name: {{ include "gateway.seedConfigName" . }}
