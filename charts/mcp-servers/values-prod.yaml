# Overrides for a production-like k3s VPS.
# Use with: helm upgrade --install mcp-servers charts/mcp-servers -n mcp-servers --create-namespace -f charts/mcp-servers/values-prod.yaml
#
# The numbers are untested starting points.
# Credentials are not set here: the WooCommerce key is copied from the store Secret and the bearer token is
# generated in the cluster.

wooMcp:
  image:
    # No registry: the images are built on the VPS ("docker build -t woo-mcp:0.1.1 services/woo-mcp", see the README) and
    # imported into k3s with "docker save | sudo k3s ctr images import -". pullPolicy Never makes the kubelet use only the imported images.
    repository: woo-mcp
    tag: "0.1.1"
    pullPolicy: Never

  store:
    # http on purpose, although the store is https. WooCommerce builds the base URL of the OAuth signature with
    # is_ssl() (class-wc-rest-authentication.php:581). woo-mcp calls WordPress inside the cluster over plain HTTP
    # without X-Forwarded-Proto, so WooCommerce signs with the scheme http. The host must equal store.host in
    # charts/store/values-prod.yaml.
    publicUrl: http://store.urumi-rk.duckdns.org
    timezone: Asia/Kolkata

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

fxMcp:
  image:
    repository: fx-mcp
    tag: "0.1.0"
    pullPolicy: Never
  # fx-mcp needs egress to api.frankfurter.dev. The NetworkPolicy (networkPolicy.enabled) allows ports 80 and 443 to the public internet.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

fetchMcp:
  image:
    repository: fetch-mcp
    tag: "0.1.0"
    pullPolicy: Never
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

# Step 17: NetworkPolicy on (decision 7).
networkPolicy:
  enabled: true
