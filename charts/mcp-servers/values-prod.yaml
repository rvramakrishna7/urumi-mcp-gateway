# Overrides for a production-like k3s VPS.
# Use with: helm upgrade --install mcp-servers charts/mcp-servers -n mcp-servers --create-namespace -f charts/mcp-servers/values-prod.yaml
#
# This file is only rendered, not deployed (the production-like deployment is Step 20). The registry, the
# domain and the numbers are placeholders and untested starting points.
# Credentials are not set here: the WooCommerce key is copied from the store Secret and the bearer token is
# generated in the cluster.

wooMcp:
  image:
    # The image comes from a registry that the VPS can reach, not from "k3d image import".
    repository: registry.example.com/urumi/woo-mcp
    tag: "0.1.1"
    pullPolicy: IfNotPresent
  # The Secret must exist in the namespace mcp-servers before the install. Create it with your own credentials
  # (never put them in this file or in Git):
  #   kubectl create namespace mcp-servers
  #   kubectl create secret docker-registry registry-credentials -n mcp-servers \
  #     --docker-server=registry.example.com --docker-username=<user> --docker-password=<token>
  imagePullSecrets:
    - registry-credentials

  store:
    # Must be exactly the home URL of the production store (store.scheme and store.host in charts/store/values-prod.yaml).
    publicUrl: http://store.example.com
    timezone: Asia/Kolkata

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

fxMcp:
  image:
    repository: registry.example.com/urumi/fx-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - registry-credentials
  # fx-mcp needs egress to api.frankfurter.dev. The NetworkPolicy (networkPolicy.enabled) allows ports 80 and 443 to the public internet.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

fetchMcp:
  image:
    repository: registry.example.com/urumi/fetch-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - registry-credentials
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

# Step 17: NetworkPolicy on (decision 7).
networkPolicy:
  enabled: true
