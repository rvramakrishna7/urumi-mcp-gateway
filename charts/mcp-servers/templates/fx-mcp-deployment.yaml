apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-mcp
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: fx-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mcp-servers.selectorLabels" (dict "root" . "component" "fx-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-servers.labels" . | nindent 8 }}
        app.kubernetes.io/component: fx-mcp
    spec:
      # fx-mcp never talks to the Kubernetes API, so it gets no ServiceAccount token.
      automountServiceAccountToken: false
      {{- with .Values.fxMcp.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Lets the group of the process read the mounted Secret file (mode 0440).
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fx-mcp
          image: "{{ .Values.fxMcp.image.repository }}:{{ .Values.fxMcp.image.tag }}"
          imagePullPolicy: {{ .Values.fxMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.fxMcp.port }}
          # Only paths and settings here. The token is read from the mounted file.
          env:
            - name: PORT
              value: {{ .Values.fxMcp.port | quote }}
            - name: ALLOWED_HOSTS
              value: {{ include "mcp-servers.fxMcp.allowedHosts" . | quote }}
            - name: MCP_AUTH_TOKEN_FILE
              value: /secrets/auth/token
            - name: FX_BASE_URL
              value: {{ .Values.fxMcp.baseUrl | quote }}
            - name: FX_REQUEST_TIMEOUT_MS
              value: {{ .Values.fxMcp.requestTimeoutMs | quote }}
          # Neither probe calls the rate service: an outage there must not take fx-mcp out of the Service or restart it,
          # because it answers tool calls with an error result in that case. /readyz answers 503 only while the process
          # shuts down. The health routes need no token and ignore the Host header (the kubelet probes the pod IP).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.fxMcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: auth
              mountPath: /secrets/auth
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: fx-mcp-auth
            defaultMode: 0440
