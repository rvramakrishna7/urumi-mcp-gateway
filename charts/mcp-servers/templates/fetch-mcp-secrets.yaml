{{- /*
The bearer token that callers (the gateway) must send to fetch-mcp (supergateway --apiKeyFile). Random on first
install, reused through lookup on upgrade, and kept on "helm uninstall", like woo-mcp-auth.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "fetch-mcp-auth" }}
apiVersion: v1
kind: Secret
metadata:
  name: fetch-mcp-auth
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: fetch-mcp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
