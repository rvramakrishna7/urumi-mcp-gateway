{{- /*
The bearer token that callers (the gateway) must send to fx-mcp. Random on first install, reused through lookup on
upgrade, and kept on "helm uninstall", like woo-mcp-auth. Under "helm template" lookup returns nothing, so a
rendered token there is random.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "fx-mcp-auth" }}
apiVersion: v1
kind: Secret
metadata:
  name: fx-mcp-auth
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: fx-mcp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
