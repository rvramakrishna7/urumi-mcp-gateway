{{- /*
ClusterIP only, and there is no Ingress in this chart: woo-mcp is reachable from inside the cluster only.
With networkPolicy.enabled, templates/networkpolicy.yaml limits the callers to the gateway pod of the gateway namespace (decision 7).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-servers.wooMcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.wooMcp.port }}
      targetPort: http
