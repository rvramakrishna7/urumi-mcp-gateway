{{- /*
Two Secrets for woo-mcp, both in the release namespace.

woo-mcp-store-api: a copy of consumer-key and consumer-secret from the Secret of the store chart. It is rendered
again on every install and upgrade, so a rotation in the store is picked up by "helm upgrade". It is owned by the
release and removed with it.

woo-mcp-auth: the bearer token that callers must send to woo-mcp. Random on first install, reused through lookup on
upgrade, and kept on "helm uninstall", like the Secrets of the store chart. Under "helm template" lookup returns
nothing, so a rendered token there is random.
*/ -}}
{{- $api := include "mcp-servers.wooMcp.storeApi" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-servers.wooMcp.storeApiSecretName" . }}
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
type: Opaque
data:
  consumer-key: {{ index $api "consumer-key" }}
  consumer-secret: {{ index $api "consumer-secret" }}
---
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "mcp-servers.wooMcp.authSecretName" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-servers.wooMcp.authSecretName" . }}
  labels:
    {{- include "mcp-servers.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
