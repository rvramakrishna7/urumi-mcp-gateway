# Static files only: nginx never proxies. The Ingress sends /api and /mcp to the gateway, everything else here.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # The probes of the pod. Static: it depends on nothing but nginx itself. The Ingress does not route it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # The readiness path of the gateway, which the Ingress does not route. Without this, the single-page fallback below would
    # answer it with the HTML of the dashboard and a 200.
    location = /readyz {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "not found\n";
    }

    # A path of the API that the Ingress does not route must not answer with the HTML of the dashboard.
    location ~ ^/(api|mcp)(/|$) {
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "not found\n";
    }

    # File names carry a content hash, so a file never changes under its name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Font names have no hash, so they are cached for a short time only.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Every other path is a route of the single-page app: index.html, revalidated on every load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
